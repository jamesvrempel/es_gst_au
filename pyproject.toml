[project]
name = "es_gst_au"
authors = [{ name = "Enterprise Systems Australia", email = "support@enterprisesystems.com.au" }]
description = "Australian bank import, transaction coding and BAS reporting for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
